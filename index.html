<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lamb's Journey to Bethlehem</title>
    <style>
        body { font-family: "Georgia", serif; background: linear-gradient(180deg, #0A192F 0%, #1E3A5F 40%, #90CAF9 85%, #E3F2FD 100%); color: #0D47A1; margin: 0; padding: 15px; text-align: center; }
        .container { width: 100%; max-width: 500px; margin: 0 auto; box-sizing: border-box; }
        .header, .card { background: #FFFFFF; border: 2px solid #90CAF9; border-radius: 20px; padding: 15px; margin-bottom: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .title { font-size: 20px; font-weight: 900; text-transform: uppercase; margin: 0; }
        .card-title { font-size: 14px; font-weight: 800; color: #B71C1C; text-transform: uppercase; margin-bottom: 6px; }
        .card-text { font-size: 14px; color: #212121; text-align: justify; white-space: pre-line; }
        .viewport { height: 200px; position: relative; margin-bottom: 12px; border-radius: 24px; overflow: hidden; background: linear-gradient(180deg, #030712 0%, #0B1528 70%, #1E293B 100%); border: 3px solid #FFD54F; }
        .star { position: absolute; top: 15px; right: 35px; font-size: 34px; animation: flash 1.5s infinite ease-in-out; }
        .stable { position: absolute; top: 50px; right: 25px; font-size: 45px; }
        .baby-jesus { position: absolute; top: 75px; right: 38px; font-size: 28px; display: none; }
        @keyframes flash { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        .walker { position: absolute; bottom: 15px; font-size: 34px; transition: left 0.4s; }
        .btn { width: 100%; background: linear-gradient(135deg, #1565C0 0%, #0D47A1 100%); color: #FFF; border: 3px solid #FFF; padding: 15px; border-radius: 30px; font-size: 15px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .party-item { position: absolute; pointer-events: none; font-size: 24px; animation: burstUp 2s linear forwards; }
        @keyframes burstUp { 0% { bottom: 0px; opacity: 1; transform: scale(0.5); } 100% { bottom: 85%; opacity: 0; transform: scale(1.3); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">The Lamb's Journey</h1>
            <div style="display:flex; justify-content:space-around; font-weight:bold; margin-top:5px;">
                <div id="day-lbl">Day: 1 / 40</div>
                <div id="steps-lbl">39 Steps Left</div>
            </div>
        </div>
        <div class="card">
            <div id="p-title" class="card-title">Loading...</div>
            <p id="p-text" class="card-text"></p>
        </div>
        <div class="viewport" id="v-box">
            <div class="star">⭐</div>
            <div class="stable">放置</div>
            <div class="baby-jesus" id="jesus">👶👑</div>
            <div id="w" class="walker" style="left: 5%;">👶🐑</div>
        </div>
        <button class="btn" id="action-btn" onclick="move()">Recite Prayer & Take Step</button>
    </div>
    <script>
        var day = 1;
        var devotions = [
            { t: "Advent Morning Offering (Nov 15 - Nov 29)", p: "O Jesus, through the Immaculate Heart of Mary, I offer You my prayers, works, joys, and sufferings of this day, to prepare my heart for Your coming at Christmas. Amen.\n\nOur Father, Who art in heaven, hallowed be Thy name. Thy kingdom come. Thy will be done on earth as it is in heaven. Give us this day our daily bread and forgive us our trespasses." },
            { t: "St. Andrew Christmas Novena (Nov 30)", p: "Hail and blessed be the hour and moment in which the Son of God was born of the most pure Virgin Mary, at midnight, in Bethlehem, in the piercing cold. In that hour vouchsafe, O my God, to hear my prayer and grant my desires, through the merits of Our Savior Jesus Christ, and of His blessed Mother. Amen." },
            { t: "The Advent Magnificat Countdown (Dec 1 - Dec 24)", p: "My soul magnifies the Lord, and my spirit rejoices in God my Savior. For He who is mighty has done great things for me, and holy is His name. Amen.\n\nHail and blessed be the hour and moment in which the Son of God was born of the most pure Virgin Mary, at midnight, in Bethlehem, in the piercing cold. Amen." }
        ];
        function show() {
            var i = day < 16 ? 0 : (day === 16 ? 1 : 2);
            document.getElementById('p-title').innerText = devotions[i].t;
            document.getElementById('p-text').innerText = devotions[i].p;
            document.getElementById('w').style.left = (5 + (day - 1) * 2) + "%";
        }
        function party() {
            var items = ['🎈', '🌸', '🎁', '🎉', '✨'];
            var box = document.getElementById('v-box');
            for (var i = 0; i < 20; i++) {
                (function(idx) {
                    setTimeout(function() {
                        var p = document.createElement('div');
                        p.className = 'party-item';
                        p.innerText = items[Math.floor(Math.random() * items.length)];
                        p.style.left = (Math.random() * 80 + 5) + "%";
                        box.appendChild(p);
                        setTimeout(function() { p.remove(); }, 2000);
                    }, idx * 100);
                })(i);
            }
        }
        function move() {
            if (day < 40) {
                day++;
                document.getElementById('day-lbl').innerText = "Day: " + day + " / 40";
                document.getElementById('steps-lbl').innerText = (40 - day) + " Steps Left";
                show();
                if (day === 40) {
                    document.getElementById('jesus').style.display = 'block';
                    document.getElementById('action-btn').disabled = true;
                    document.getElementById('action-btn').innerText = "Arrived at the Manger! 🎉";
                    party();
                }
            }
        }
        show();
    </script>
</body>
</html>
